<!doctype html>
<html lang="en-CA">

    <meta property="og:title" content="Canadian Mortgage Calculator Suite" />

    <link
      rel="icon"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"

  <body class="w-headings">
    <a class="skip" href="#main">Skip to calculators</a>

      <p>Educational only, not financial advice. <span class="w-script">John Khan</span></p>
